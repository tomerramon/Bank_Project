# docker-compose.yml - Orchestrates all containers

version: '3.8'  # Docker Compose version

services:
  # Service 1: MongoDB Database
  mongodb:
    image: mongo:6.0  # Use official MongoDB image
    container_name: bank-mongodb
    restart: unless-stopped  # Auto-restart if crashes
    
    # Environment variables for MongoDB
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secretpassword123
      # Change these in production!
    
    # Persistent storage (data survives container restart)
    volumes:
      - mongodb_data:/data/db
      # mongodb_data = named volume (defined at bottom)
      # /data/db = where MongoDB stores data
    
    # Port mapping: host:container
    ports:
      - "27017:27017"
      # Access MongoDB at localhost:27017
    
    # Health check
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    
    # Network
    networks:
      - bank-network

  # Service 2: Your Backend
  backend:
    build:
      context: .  # Build from current directory
      dockerfile: Dockerfile  # Use the Dockerfile we created
    
    container_name: bank-backend
    restart: unless-stopped
    
    # Environment variables for your app
    environment:
      NODE_ENV: production
      PORT: 5000
      
      # MongoDB connection (uses service name 'mongodb')
      MONGODB_URI: mongodb://admin:secretpassword123@mongodb:27017/bankdb?authSource=admin
      # mongodb:// = protocol
      # admin:secretpassword123 = credentials
      # @mongodb = service name (Docker DNS resolves this)
      # :27017 = port
      # /bankdb = database name
      # ?authSource=admin = authenticate against admin database
      
      # JWT secrets (CHANGE THESE!)
      JWT_ACCESS_SECRET: your-super-secret-access-key-change-this
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-this
      
      # Email (add your credentials)
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: your-email@gmail.com
      SMTP_PASS: your-app-password
      SMTP_FROM: "Bank App <noreply@bankapp.com>"
      
      # Twilio (add your credentials)
      # TWILIO_ACCOUNT_SID: your_account_sid
      # TWILIO_AUTH_TOKEN: your_auth_token
      # TWILIO_PHONE_NUMBER: +1234567890
      
      # App config
      APP_NAME: Bank App
      FRONTEND_URL: http://localhost:3000
    
    # Port mapping
    ports:
      - "5000:5000"
      # Access backend at localhost:5000
    
    # Wait for MongoDB to be ready before starting
    depends_on:
      mongodb:
        condition: service_healthy
    
    # Restart if MongoDB connection fails
    restart: on-failure
    
    # Mount code for development (optional)
    volumes:
      - ./src:/app/src  # Hot reload in development
      - /app/node_modules  # Don't overwrite node_modules
    
    networks:
      - bank-network

# Named volumes (persistent storage)
volumes:
  mongodb_data:
    driver: local
    # Data persists even when containers are removed

# Networks (containers can talk to each other)
networks:
  bank-network:
    driver: bridge
    # Creates a private network for containers

# -----------------------------
# HOW TO USE:
# -----------------------------

# 1. Start everything:
#    docker-compose up
#    (or docker-compose up -d for background)

# 2. Stop everything:
#    docker-compose down

# 3. Stop and remove data:
#    docker-compose down -v
#    (WARNING: deletes database!)

# 4. View logs:
#    docker-compose logs backend
#    docker-compose logs mongodb

# 5. Rebuild after code changes:
#    docker-compose up --build

# 6. Run in background:
#    docker-compose up -d
#    docker-compose logs -f  # follow logs